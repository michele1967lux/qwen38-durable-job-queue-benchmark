[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-job-queue"
version = "0.1.0"
description = "Durable local job queue backed by SQLite"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bench-agent" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
# No runtime dependencies: stdlib only (sqlite3, json, argparse, secrets).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jobq = "durable_job_queue.cli:main"

[tool.setuptools]
packages = ["durable_job_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
